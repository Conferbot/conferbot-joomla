PLG_SYSTEM_CONFERBOT="System - Conferbot"
PLG_SYSTEM_CONFERBOT_XML_DESCRIPTION="Turn visitors into customers with an AI chatbot and live chat widget. Automate 24/7 customer support, capture leads, answer questions, and hand over to human agents - set up in under a minute with no code. Paste your Chatbot ID below and enable the plugin; appearance and behavior are managed in your Conferbot dashboard."
PLG_SYSTEM_CONFERBOT_BOT_ID_LABEL="Chatbot ID"
PLG_SYSTEM_CONFERBOT_BOT_ID_DESC="Paste your Chatbot ID - a 24-character code, e.g. 64a1b2c3d4e5f6a7b8c9d0e1. In your Conferbot dashboard open your bot, go to Share > Embed and copy the code - the plugin finds the ID in it (a dashboard URL works too). No account yet? Paste 691c970890527a0468f9b2c9 to try our demo bot - it works right away, no signup needed."
PLG_SYSTEM_CONFERBOT_EMBED_TYPE_LABEL="How the chat appears"
PLG_SYSTEM_CONFERBOT_EMBED_TYPE_DESC="Floating chat bubble shows the classic launcher in the corner of every page. Popup window opens the chat in a larger overlay instead."
PLG_SYSTEM_CONFERBOT_EMBED_TYPE_LIVE_CHAT="Floating chat bubble (recommended)"
PLG_SYSTEM_CONFERBOT_EMBED_TYPE_POPUP_CHAT="Popup window"
PLG_SYSTEM_CONFERBOT_IDENTITY_SECRET_LABEL="Identity verification secret (optional)"
PLG_SYSTEM_CONFERBOT_IDENTITY_SECRET_DESC="From Conferbot workspace settings > Security > Identity verification. Each logged-in user is then signed on your server, so Conferbot can trust their name and email. The secret never reaches the browser."
PLG_SYSTEM_CONFERBOT_SCRIPT_URL_LABEL="Widget script URL (advanced)"
PLG_SYSTEM_CONFERBOT_SCRIPT_URL_DESC="Leave as is to load the widget from the Conferbot CDN. Only change this for staging or self-hosted widget builds."
